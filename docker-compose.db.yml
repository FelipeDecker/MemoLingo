services:
  postgres:
    image: postgres:17-alpine
    container_name: memolingo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: memolingo
      POSTGRES_USER: memolingo
      POSTGRES_PASSWORD: memolingo
    ports:
      - "5432:5432"
    volumes:
      - memolingo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memolingo -d memolingo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  memolingo-postgres-data:
